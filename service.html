<!doctype html>

  <style>
    :root{--navy:#073b78;--blue:#0b91dd;--sky:#eef8ff;--yellow:#ffd55a;--ink:#102f4b;--muted:#526e84;--line:#bcdbea}
    *{box-sizing:border-box}body{margin:0;background:#eaf2f8;color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;font-size:24px}
    .app{width:min(100%,560px);min-height:100vh;margin:auto;background:#fff;padding-bottom:30px;box-shadow:0 0 38px #0a35551a}
    header{padding:30px 22px 34px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--blue));border-radius:0 0 32px 32px}

    main{padding:24px 20px}.links{display:grid;grid-template-columns:1fr;gap:16px}.item{display:flex;align-items:center;justify-content:space-between;min-height:122px;padding:21px 20px;border:3px solid var(--line);border-radius:22px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 6px 18px #0d416910}.item strong{display:block;font-size:32px;line-height:1.3}.item span span{display:block;margin-top:7px;color:var(--muted);font-size:21px;font-weight:700;line-height:1.45}.item b{font-size:38px;color:var(--blue)}
    .item.hot{border-color:#efbd26;background:#fff8d9}.item.hot b{color:#a86600}.booking{display:block;margin-top:20px;padding:23px 18px;border-radius:20px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;text-align:center;text-decoration:none;font-size:30px;font-weight:900}
  </style>
</head>
